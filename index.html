<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/bharat-yatra-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bharat Yatra</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
        "gsap": "https://aistudiocdn.com/gsap@^3.13.0",
        "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
        "prop-types": "https://aistudiocdn.com/prop-types@^15.8.1",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^0.20.0"
      }
    }
    </script>
    <style>
      /* Basic Reset */
      body, html {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #000;
        color: #fff;
      }

      /* Spotlight Animation */
      @keyframes spotlight {
        from {
          opacity: 0;
          transform: translate(-71%, -61%) scale(0.5);
        }
        to {
          opacity: 1;
          transform: translate(-50%,-40%) scale(1);
        }
      }
      .animate-spotlight {
        animation: spotlight 2s ease .75s 1 forwards;
      }

      /* Grid Background */
      .bg-grid-white\/\[0\.05\] {
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      }
      
      /* Staggered Menu CSS */
      .staggered-menu-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 40;
      }

      .staggered-menu-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1rem;
        background: transparent;
        z-index: 20;
      }

      .staggered-menu-header > * {
        pointer-events: auto;
      }

      .sm-logo {
        display: flex;
        align-items: center;
        user-select: none;
      }

      .sm-logo-img {
        display: block;
        height: 32px;
        width: auto;
        object-fit: contain;
      }

      .sm-toggle {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        background: transparent;
        border: none;
        cursor: pointer;
        color: #e9e9ef;
        font-weight: 500;
        line-height: 1;
        overflow: visible;
        padding: 0;
      }

      .sm-toggle:focus-visible {
        outline: 2px solid #ffffffaa;
        outline-offset: 4px;
        border-radius: 4px;
      }

      .sm-toggle-textWrap {
        position: relative;
        display: inline-block;
        height: 1em;
        overflow: hidden;
        white-space: nowrap;
        width: var(--sm-toggle-width, auto);
        min-width: var(--sm-toggle-width, auto);
      }

      .sm-toggle-textInner {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }

      .sm-toggle-line {
        display: block;
        height: 1em;
        line-height: 1;
      }

      .sm-icon {
        position: relative;
        width: 14px;
        height: 14px;
        flex: 0 0 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .sm-panel-itemWrap {
        position: relative;
        overflow: hidden;
        line-height: 1;
      }

      .sm-icon-line {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
        transform: translate(-50%, -50%);
        will-change: transform;
      }

      .sm-line {
        display: none !important;
      }

      .staggered-menu-panel {
        position: fixed;
        top: 0;
        right: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(to bottom right, #1f2937, #111827, #000);
        display: flex;
        flex-direction: column;
        padding: 6em 2em 2em 2em;
        overflow-y: auto;
        z-index: 1000;
      }
      
      [data-position='left'] .staggered-menu-panel {
        right: auto;
        left: 0;
      }

      .sm-close-btn {
        position: absolute;
        top: 1rem;
        right: 1.5rem;
        width: 32px;
        height: 32px;
        background: transparent;
        border: none;
        cursor: pointer;
        z-index: 1100;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 0.5rem;
        transition: color 0.3s ease;
      }

      .sm-close-btn:hover {
        color: var(--sm-accent, #ff6b6b);
      }

      .sm-close-icon-open {
        font-size: 2rem;
        font-weight: bold;
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform;
        transition: transform 0.3s ease;
        transform: rotate(0deg);
      }

      .sm-close-icon-closed {
        font-size: 2rem;
        font-weight: bold;
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform;
        transition: transform 0.3s ease;
        transform: rotate(0deg);
      }

      .sm-prelayers {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: clamp(260px, 38vw, 420px);
        pointer-events: none;
        z-index: 5;
      }

      [data-position='left'] .sm-prelayers {
        right: auto;
        left: 0;
      }

      .sm-prelayer {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        width: 100%;
        transform: translateX(0);
      }

      .sm-panel-inner {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .sm-socials {
        margin-top: auto;
        padding-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .sm-socials-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        color: var(--sm-accent, #ff0000);
      }

      .sm-socials-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .sm-socials-list .sm-socials-link {
        opacity: 1;
      }

      .sm-socials-list:hover .sm-socials-link {
        opacity: 0.35;
      }

      .sm-socials-list:hover .sm-socials-link:hover {
        opacity: 1;
      }

      .sm-socials-link:focus-visible {
        outline: 2px solid var(--sm-accent, #ff0000);
        outline-offset: 3px;
      }

      .sm-socials-list:focus-within .sm-socials-link {
        opacity: 0.35;
      }

      .sm-socials-list:focus-within .sm-socials-link:focus-visible {
        opacity: 1;
      }

      .sm-socials-link {
        font-size: 1.2rem;
        font-weight: 500;
        color: #e5e7eb;
        text-decoration: none;
        position: relative;
        padding: 2px 0;
        display: inline-block;
        transition:
          color 0.3s ease,
          opacity 0.3s ease;
      }

      .sm-socials-link:hover {
        color: var(--sm-accent, #ff0000);
      }

      .sm-panel-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        text-transform: uppercase;
      }

      .sm-panel-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .sm-panel-item {
        position: relative;
        color: #fff;
        font-weight: 600;
        font-size: 3.5rem;
        cursor: pointer;
        line-height: 1;
        letter-spacing: -2px;
        text-transform: uppercase;
        transition:
          background 0.25s,
          color 0.25s;
        display: inline-block;
        text-decoration: none;
        padding-right: 1.4em;
      }

      .staggered-menu-panel .sm-socials-list .sm-socials-link {
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .staggered-menu-panel .sm-socials-list:hover .sm-socials-link:not(:hover) {
        opacity: 0.35;
      }

      .staggered-menu-panel .sm-socials-list:focus-within .sm-socials-link:not(:focus-visible) {
        opacity: 0.35;
      }

      .staggered-menu-panel .sm-socials-list .sm-socials-link:hover,
      .staggered-menu-panel .sm-socials-list .sm-socials-link:focus-visible {
        opacity: 1;
      }

      .sm-panel-itemLabel {
        display: inline-block;
        will-change: transform;
        transform-origin: 50% 100%;
      }

      .sm-panel-item:hover {
        color: var(--sm-accent, #5227ff);
      }

      .sm-panel-list[data-numbering] {
        counter-reset: smItem;
      }

      .sm-panel-list[data-numbering] .sm-panel-item::after {
        counter-increment: smItem;
        content: counter(smItem, decimal-leading-zero);
        position: absolute;
        top: 0.1em;
        right: 2.8em;
        font-size: 18px;
        font-weight: 400;
        color: var(--sm-accent, #5227ff);
        letter-spacing: 0;
        pointer-events: none;
        user-select: none;
        opacity: var(--sm-num-opacity, 0);
      }

      @media (max-width: 1024px) {
        .staggered-menu-panel {
          width: 100%;
          left: 0;
          right: 0;
        }
      }

      @media (max-width: 640px) {
        .staggered-menu-panel {
          width: 100%;
          left: 0;
          right: 0;
        }
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
